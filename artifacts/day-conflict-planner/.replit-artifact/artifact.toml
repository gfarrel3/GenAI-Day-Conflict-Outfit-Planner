kind = "web"
previewPath = "/"
title = "Day-Conflict Outfit Planner"
description = "A single-page prototype that turns pasted event schedules into prewritten outfit plans for a few example days. It is intentionally simulated and stores no user input."
version = "1.0.0"
id = "artifacts/day-conflict-planner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25427

[services.development]
run = "pnpm --filter @workspace/day-conflict-planner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/day-conflict-planner", "run", "build" ]
serve = "static"
publicDir = "artifacts/day-conflict-planner/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25427"
BASE_PATH = "/"
